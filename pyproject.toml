[project]
name = "chorus-abbrivio"
version = "0.2.1"
description = "OTLP-native quality workflows for agents and AI applications"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Jeremy Johnson" }]
dependencies = [
    "fastapi>=0.109,<1",
    "opentelemetry-api>=1.39,<2",
    "opentelemetry-exporter-otlp-proto-common>=1.39,<2",
    "opentelemetry-proto>=1.39,<2",
    "opentelemetry-sdk>=1.39,<2",
    "protobuf>=5,<7",
    "pydantic>=2.11,<3",
    "uvicorn>=0.27,<1",
]

[project.optional-dependencies]
otlp-http = ["opentelemetry-exporter-otlp-proto-http>=1.39,<2"]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
    "ruff>=0.12,<1",
]

[project.scripts]
chorus = "chorus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abbrivio", "src/chorus"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["B", "C4", "E", "F", "I", "UP", "W"]
